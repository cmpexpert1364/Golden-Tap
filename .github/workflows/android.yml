name: Build Golden Tap Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Decode Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/goldentap.jks"

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 \
          android/app/build/outputs/apk/debug/app-debug.apk \
          "$RUNNER_TEMP/goldentap-aligned.apk"

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/goldentap.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/GoldenTap-Signed.apk" \
            "$RUNNER_TEMP/goldentap-aligned.apk"

      - name: Verify APK Signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
          --verbose "$RUNNER_TEMP/GoldenTap-Signed.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenTap-Signed-APK
          path: ${{ runner.temp }}/GoldenTap-Signed.apk
